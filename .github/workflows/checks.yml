name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test
        run: docker compose run --rm app python manage.py test

      - name: Lint
        run: docker compose run --rm app flake8

      - name: Deploy config is valid
        run: |
          cp .env.sample .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci/; s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci/' .env
          docker compose -f docker-compose.deploy.yml config --quiet
