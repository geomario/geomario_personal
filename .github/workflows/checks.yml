# Pull requests: tests, lint and a deploy-config check.
# Push to main: the same checks, then build the app image, push it to ghcr.io and
# deploy it to the server over SSH (scripts/deploy.sh).
#
# The deploy job is skipped until the repository variable DEPLOY_HOST is set. It also
# needs the variable DEPLOY_KNOWN_HOSTS and the secret DEPLOY_SSH_KEY (README "Deploy").
name: Checks and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        run: docker compose run --rm app python manage.py test

      - name: Lint
        run: docker compose run --rm app flake8

      - name: Deploy config is valid
        run: |
          cp .env.sample .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci/; s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci/' .env
          docker compose -f docker-compose.deploy.yml config --quiet

  deploy:
    name: Build image and deploy
    needs: test-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    # Never run two deploys at once; a newer push waits for the running one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run scripts/deploy.sh; the "command" is the commit to deploy.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "deploy@$HOST" "$GITHUB_SHA"
