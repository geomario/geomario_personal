# Local development. Production: docker-compose.deploy.yml.
services:
  app:
    build:
      context: .
      args:
        - DEV=1
    image: mario-portfolio:dev
    container_name: mario-portfolio
    ports:
      - "8000:8000"
    # Code is mounted, so edits show up without rebuilding.
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_initial_data &&
             python manage.py ensure_superuser &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_DEBUG=1
      - DB_HOST=db
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DJANGO_SUPERUSER_USER=${DJANGO_SUPERUSER_USER:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: mario-portfolio-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Terraform for the Hetzner server, without installing it (see README "Deploy"):
  #   docker compose run --rm terraform plan
  # Needs HCLOUD_TOKEN in your environment. Not started by `docker compose up`.
  terraform:
    image: hashicorp/terraform:1.15.4
    profiles: [tools]
    working_dir: /app/infra
    entrypoint: ["sh", "/app/docker/terraform.sh"]
    volumes:
      - .:/app
      - terraform_data:/terraform-data
      - ${HOME}/.ssh/id_ed25519.pub:/ssh/id.pub:ro
    environment:
      - HCLOUD_TOKEN

volumes:
  postgres_data:
  terraform_data:
