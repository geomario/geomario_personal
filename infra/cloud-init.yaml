#cloud-config
# First-boot setup for the server (runs once, as root). Check progress on the
# server with: cloud-init status --wait

package_update: true
package_upgrade: true

# Key-only SSH: no password logins.
ssh_pwauth: false

runcmd:
  # Docker Engine + Compose plugin from Docker's apt repository
  # (https://docs.docker.com/engine/install/ubuntu/).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # 2 GB swap: headroom for a small server when building images.
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # "deploy" user for GitHub Actions; starts with the same key as root.
  - useradd --create-home --shell /bin/bash --groups docker deploy
  - install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
  - install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
