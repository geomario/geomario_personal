services:
  app:
    build:
      context: .
    restart: always
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN:?set DOMAIN in .env}
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://${DOMAIN}
      - DJANGO_BEHIND_HTTPS_PROXY=1
      # nginx already sends HSTS.
      - DJANGO_HSTS_SECONDS=0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-portfolio}
      - DB_USER=${DB_USER:-portfolio}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DJANGO_SUPERUSER_USER=${DJANGO_SUPERUSER_USER:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-portfolio}
      - POSTGRES_USER=${DB_USER:-portfolio}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: ./docker/proxy
    restart: always
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
    volumes:
      - certbot-web:/vol/www
      - proxy-dhparams:/vol/proxy
      - certbot-certs:/etc/letsencrypt
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}

  certbot:
    build:
      context: ./docker/certbot
    command: echo "Skipping..."
    environment:
      - EMAIL=${ACME_DEFAULT_EMAIL:?set ACME_DEFAULT_EMAIL in .env}
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - certbot-web:/vol/www
      - certbot-certs:/etc/letsencrypt/
    depends_on:
      - proxy

volumes:
  postgres-data:
  certbot-web:
  proxy-dhparams:
  certbot-certs:
